<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="ctShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base (Full for maskable compatibility) -->
  <rect width="512" height="512" rx="112" fill="url(#ctGrad)" />

  <!-- Chat Bubble with Rounded Contours -->
  <g filter="url(#ctShadow)">
    <path d="M 120 150 
             C 120 120, 140 100, 175 100 
             L 337 100 
             C 372 100, 392 120, 392 150 
             L 392 280 
             C 392 310, 372 330, 337 330 
             L 220 330 
             L 155 385 
             C 142 396, 120 387, 120 370 
             Z" 
          fill="#ffffff" />
  </g>

  <!-- Checkmark Badge & Task Elements (Emerald Gradient) -->
  <path d="M 200 215 
           L 245 260 
           L 325 175" 
        fill="none" 
        stroke="url(#ctGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Task Dots indicating list items -->
  <circle cx="165" cy="215" r="10" fill="#059669" />
</svg>

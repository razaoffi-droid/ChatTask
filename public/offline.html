<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ChatTask — Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #059669 0%, #064e3b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 15px -3px rgba(4, 120, 87, 0.4);
    }
    .icon-wrap svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      background: #047857;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #059669;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      margin-top: 10px;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"></path>
      </svg>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>No Internet Connection</span>
    </div>
    <h1>You're Offline</h1>
    <p>
      ChatTask requires an active network connection to sync live messages, encrypt transfers, and load updates. Please check your Wi-Fi or mobile data.
    </p>
    <button class="btn" id="retry-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Retry Connection</span>
    </button>
    <button class="btn btn-secondary" onclick="window.history.back()">
      <span>Go Back</span>
    </button>
    <p class="footer-note">
      ChatTask will automatically reconnect as soon as your internet returns.
    </p>
  </div>

  <script>
    document.getElementById('retry-btn').addEventListener('click', function() {
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        const btn = document.getElementById('retry-btn');
        btn.style.opacity = '0.7';
        btn.querySelector('span').textContent = 'Still Offline...';
        setTimeout(() => {
          btn.style.opacity = '1';
          btn.querySelector('span').textContent = 'Retry Connection';
        }, 1500);
      }
    });

    // Auto-redirect back to main application when network returns
    window.addEventListener('online', function() {
      window.location.href = '/';
    });
  </script>
</body>
</html>
